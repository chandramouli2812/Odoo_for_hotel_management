version: '3.8'

services:
  web:
    image: odoo:18.0
    container_name: odoo_hotel_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_secure_password
    volumes:
      - ./custom_addons:/mnt/extra-addons:ro
      - ./odoo.conf.example:/etc/odoo/odoo.conf
      - odoo-web-data:/var/lib/odoo
    networks:
      - odoo-net

  db:
    image: postgres:15-alpine
    container_name: odoo_hotel_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_secure_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-net

volumes:
  odoo-web-data:
  odoo-db-data:

networks:
  odoo-net:
    driver: bridge
